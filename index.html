<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Timer</title>

<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
  color:white;
}

.container{
  text-align:center;
}

.flip-group{
  display:flex;
  gap:15px;
  margin-bottom:40px;
}

.flip-card{
  position:relative;
  width:80px;
  height:100px;
  perspective:1000px;
}

.card{
  position:absolute;
  width:100%;
  height:100%;
}

.top, .bottom{
  position:absolute;
  width:100%;
  height:50%;
  overflow:hidden;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
}

.top{
  top:0;
  border-bottom:1px solid #000;
}

.bottom{
  bottom:0;
  border-top:1px solid #000;
}

.flip-top{
  animation:flipTop 0.5s forwards;
  transform-origin:bottom;
}

.flip-bottom{
  animation:flipBottom 0.5s forwards;
  transform-origin:top;
}

@keyframes flipTop{
  0%{transform:rotateX(0deg);}
  100%{transform:rotateX(-90deg);}
}

@keyframes flipBottom{
  0%{transform:rotateX(90deg);}
  100%{transform:rotateX(0deg);}
}

button{
  margin:5px;
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
}
</style>
</head>

<body>
<div class="container">

<select id="timeSelect">
<option value="900">15分</option>
<option value="1800">30分</option>
<option value="2700">45分</option>
<option value="3600">1時間</option>
<option value="5400">1時間30分</option>
<option value="7200">2時間</option>
<option value="9000">2時間30分</option>
<option value="10800">3時間</option>
</select>

<div class="flip-group">
  <div class="flip-card" id="hh"></div>
  <div class="flip-card" id="mm"></div>
  <div class="flip-card" id="ss"></div>
</div>

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>

</div>

<script>
let totalSeconds = 0;
let intervalID = null;

function createStaticCard(el, value){
  el.innerHTML = `
    <div class="card">
      <div class="top">${value}</div>
      <div class="bottom">${value}</div>
    </div>`;
}

function flipTo(el, newValue){
  const currentTop = el.querySelector('.top');
  if(currentTop.textContent === newValue) return;

  const topFlip = currentTop.cloneNode(true);
  topFlip.textContent = currentTop.textContent;
  topFlip.classList.add('flip-top');

  const bottomFlip = document.createElement('div');
  bottomFlip.className = 'bottom flip-bottom';
  bottomFlip.textContent = newValue;

  el.appendChild(topFlip);
  el.appendChild(bottomFlip);

  setTimeout(()=>{
    createStaticCard(el, newValue);
  },500);
}

function pad(n){
  return String(n).padStart(2,'0');
}

function updateDisplay(){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;

  flipTo(document.getElementById('hh'), pad(h));
  flipTo(document.getElementById('mm'), pad(m));
  flipTo(document.getElementById('ss'), pad(s));
}

function tick(){
  if(totalSeconds<=0){
    stopTimer();
    return;
  }
  totalSeconds--;
  updateDisplay();
}

function startTimer(){
  if(intervalID) return;
  intervalID = setInterval(tick,1000);
}

function stopTimer(){
  clearInterval(intervalID);
  intervalID = null;
}

function resetTimer(){
  stopTimer();
  totalSeconds = Number(document.getElementById('timeSelect').value);
  createStaticCard(document.getElementById('hh'), pad(Math.floor(totalSeconds/3600)));
  createStaticCard(document.getElementById('mm'), pad(Math.floor((totalSeconds%3600)/60)));
  createStaticCard(document.getElementById('ss'), pad(totalSeconds%60));
}

resetTimer();
</script>

</body>
</html>
