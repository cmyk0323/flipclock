<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Flip Timer</title>

<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  color:white;
}

.container{
  text-align:center;
}

.flip-group{
  display:flex;
  gap:20px;
  margin:30px 0;
}

.flip{
  position:relative;
  width:90px;
  height:110px;
  perspective:1000px;
}

.static{
  position:absolute;
  width:100%;
  height:100%;
  z-index:1;
}

.top,.bottom{
  position:absolute;
  width:100%;
  height:50%;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  overflow:hidden;
}

.top{
  top:0;
  border-bottom:1px solid #000;
}

.bottom{
  bottom:0;
  border-top:1px solid #000;
}

.flip-top{
  position:absolute;
  width:100%;
  height:50%;
  top:0;
  background:#222;
  transform-origin:bottom;
  animation:flipTop .4s forwards;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  z-index:2;
}

.flip-bottom{
  position:absolute;
  width:100%;
  height:50%;
  bottom:0;
  background:#222;
  transform-origin:top;
  animation:flipBottom .4s forwards;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  transform:rotateX(90deg);
  z-index:2;
}

@keyframes flipTop{
  0%{transform:rotateX(0deg);}
  100%{transform:rotateX(-90deg);}
}

@keyframes flipBottom{
  0%{transform:rotateX(90deg);}
  100%{transform:rotateX(0deg);}
}

button{
  margin:5px;
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
}
</style>
</head>

<body>
<div class="container">

<select id="timeSelect">
<option value="900">15分</option>
<option value="1800">30分</option>
<option value="2700">45分</option>
<option value="3600">1時間</option>
<option value="5400">1時間30分</option>
<option value="7200">2時間</option>
<option value="9000">2時間30分</option>
<option value="10800">3時間</option>
</select>

<div class="flip-group">
  <div class="flip" id="hh"></div>
  <div class="flip" id="mm"></div>
  <div class="flip" id="ss"></div>
</div>

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>

</div>

<script>
let totalSeconds=0;
let interval=null;

function pad(n){
  return String(n).padStart(2,'0');
}

function createStatic(el,value){
  el.innerHTML=`
    <div class="static">
      <div class="top">${value}</div>
      <div class="bottom">${value}</div>
    </div>`;
}

function flip(el,newValue){
  const staticTop=el.querySelector('.top');
  if(staticTop.textContent===newValue)return;

  const current=staticTop.textContent;

  const topFlip=document.createElement('div');
  topFlip.className='flip-top';
  topFlip.textContent=current;

  const bottomFlip=document.createElement('div');
  bottomFlip.className='flip-bottom';
  bottomFlip.textContent=newValue;

  el.appendChild(topFlip);
  el.appendChild(bottomFlip);

  setTimeout(()=>{
    createStatic(el,newValue);
    topFlip.remove();
    bottomFlip.remove();
  },400);
}

  const m=Math.floor((totalSeconds%3600)/60);
  const s=totalSeconds%60;

  flip(hh,pad(h));
  flip(mm,pad(m));
  flip(ss,pad(s));
}
