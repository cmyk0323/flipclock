<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Flip Timer</title>

<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  color:white;
}

.container{
  text-align:center;
}

.flip-group{
  display:flex;
  gap:20px;
  margin:30px 0;
}

.flip{
  position:relative;
  width:90px;
  height:110px;
  perspective:1000px;
}

.static-card{
  position:absolute;
  width:100%;
  height:100%;
}

.top, .bottom{
  position:absolute;
  width:100%;
  height:50%;
  overflow:hidden;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
}

.top{
  top:0;
  border-bottom:1px solid #000;
}

.bottom{
  bottom:0;
  border-top:1px solid #000;
}

.flip-card{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
}

.flip-top{
  position:absolute;
  width:100%;
  height:50%;
  top:0;
  background:#222;
  transform-origin:bottom;
  animation:flipTop 0.4s forwards;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  border-bottom:1px solid #000;
}

.flip-bottom{
  position:absolute;
  width:100%;
  height:50%;
  bottom:0;
  background:#222;
  transform-origin:top;
  animation:flipBottom 0.4s forwards;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  border-top:1px solid #000;
  transform:rotateX(90deg);
}

@keyframes flipTop{
  0%{transform:rotateX(0deg);}
  100%{transform:rotateX(-90deg);}
}

@keyframes flipBottom{
  0%{transform:rotateX(90deg);}
  100%{transform:rotateX(0deg);}
}

button{
  margin:5px;
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
}
</style>
</head>

<body>
<div class="container">

<select id="timeSelect">
<option value="900">15分</option>
<option value="1800">30分</option>
<option value="2700">45分</option>
<option value="3600">1時間</option>
<option value="5400">1時間30分</option>
<option value="7200">2時間</option>
<option value="9000">2時間30分</option>
<option value="10800">3時間</option>
</select>

<div class="flip-group">
  <div class="flip" id="hh"></div>
  <div class="flip" id="mm"></div>
  <div class="flip" id="ss"></div>
</div>

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>

</div>

<script>
let totalSeconds=0;
let interval=null;

function pad(n){
  return String(n).padStart(2,'0');
}

function initFlip(el,value){
  el.innerHTML=`
    <div class="static-card">
      <div class="top">${value}</div>
      <div class="bottom">${value}</div>
    </div>`;
}

function flip(el,newValue){
  const staticTop=el.querySelector('.top');
  if(staticTop.textContent===newValue)return;

  const current=staticTop.textContent;

  const flipCard=document.createElement('div');
  flipCard.className='flip-card';

  flipCard.innerHTML=`
    <div class="flip-top">${current}</div>
    <div class="flip-bottom">${newValue}</div>
  `;

  el.appendChild(flipCard);

  setTimeout(()=>{
    initFlip(el,newValue);
  },400);
}

function update(){
  const h=Math.floor(totalSeconds/3600);
  const m=Math.floor((totalSeconds%3600)/60);
  const s=totalSeconds%60;

  flip(document.getElementById('hh'),pad(h));
  flip(document.getElementById('mm'),pad(m));
  flip(document.getElementById('ss'),pad(s));
}

function tick(){
  if(totalSeconds<=0){
    stopTimer();
    return;
  }
  totalSeconds--;
  update();
}

function startTimer(){
  if(interval)return;
  interval=setInterval(tick,1000);
}

function stopTimer(){
  clearInterval(interval);
  interval=null;
}

function resetTimer(){
  stopTimer();
  totalSeconds=Number(document.getElementById('timeSelect').value);
  initFlip(document.getElementById('hh'),pad(Math.floor(totalSeconds/3600)));
  initFlip(document.getElementById('mm'),pad(Math.floor((totalSeconds%3600)/60)));
  initFlip(document.getElementById('ss'),pad(totalSeconds%60));
}

resetTimer();
</script>

</body>
</html>
